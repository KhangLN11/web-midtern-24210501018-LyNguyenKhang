<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeHub - Khóa học</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="MEDIA/IMAGE/Mixigaming-Logo.jpg" type="image/x-icon">

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
         <a class="navbar-brand d-flex align-items-center" href="index.html">
    <img
        src="MEDIA/IMAGE/Mixigaming-Logo.jpg"
        alt="Logo"
        width="50"
        class="me-2">
    <span class="fw-bold">
        BRB
    </span>
</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="index.html">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="courses.html">Khóa học</a></li>
                <li class="nav-item"><a class="nav-link" href="register.html">Đăng ký</a></li>
                <li class="nav-item"><a class="nav-link" href="registrations.html">Danh sách đăng ký</a></li>
                <li class="nav-item">
                    <button id="darkModeBtn" class="btn btn-outline-light btn-sm ms-lg-3">
                        🌙 Dark Mode
                    </button>
                </li>
            </ul>
        </div>
    </div>

</nav>

<main class="container py-5">

    <h1 class="text-center mb-4">Danh sách khóa học</h1>

    <div class="row mb-4">
        <div class="col-md-4 mb-2">
            <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm khóa học...">
        </div>

        <div class="col-md-3 mb-2">
            <select id="categoryFilter" class="form-select">
                <option value="">Tất cả danh mục</option>
                <option value="Frontend">Frontend</option>
                <option value="Programming">Programming</option>
                <option value="Desktop">Desktop</option>
                <option value="Database">Database</option>
                <option value="AI">AI</option>
            </select>
        </div>

        <div class="col-md-3 mb-2">
            <select id="levelFilter" class="form-select">
                <option value="">Tất cả cấp độ</option>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>
        </div>

        <div class="col-md-2 mb-2">
            <button id="resetBtn" class="btn btn-secondary w-100">Reset</button>
        </div>
    </div>

    <div class="row" id="courseContainer"></div>

</main>

<div class="modal fade" id="courseModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Tên khóa học</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <img id="modalImage" src="" class="img-fluid mb-3">

                <p id="modalDetail"></p>

                <p><strong>Danh mục:</strong> <span id="modalCategory"></span></p>
                <p><strong>Cấp độ:</strong> <span id="modalLevel"></span></p>
                <p><strong>Ngày học:</strong> <span id="modalDate"></span></p>
            </div>

            <div class="modal-footer">
                <a href="register.html" class="btn btn-primary">Đăng ký</a>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
            </div>

        </div>
    </div>
</div>

<footer class="footer text-center">
    <p class="mb-1">CodeHub - Website đăng ký khóa học lập trình</p>
    <p class="mb-0">Sinh viên thực hiện: Lý Khang</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
