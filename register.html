    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
         <a class="navbar-brand d-flex align-items-center" href="index.html">
    <img
        src="/MEDIA/IMAGE/Mixigaming-Logo.jpg"
        alt="Logo"
        width="50"
        class="me-2">
    <span class="fw-bold">
        BRB
    </span>
</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="courses.html">Khóa học</a></li>

                <li class="nav-item"><a class="nav-link" href="registrations.html">Danh sách đăng ký</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">

    <h1 class="text-center mb-4">Đăng ký khóa học</h1>

    <form id="registerForm" class="card p-4 shadow">

        <div class="mb-3">
            <label class="form-label">Họ và tên</label>
            <input type="text" id="fullName" class="form-control">
            <small class="text-danger" id="nameError"></small>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" id="email" class="form-control">
            <small class="text-danger" id="emailError"></small>
        </div>

        <div class="mb-3">
            <label class="form-label">Số điện thoại</label>
            <input type="text" id="phone" class="form-control">
            <small class="text-danger" id="phoneError"></small>
        </div>

        <div class="mb-3">
            <label class="form-label">Lớp</label>
            <input type="text" id="className" class="form-control">
            <small class="text-danger" id="classError"></small>
        </div>

        <div class="mb-3">
            <label class="form-label">Chọn khóa học</label>
            <select id="courseSelect" class="form-select">
                <option value="">-- Chọn khóa học --</option>
            </select>
            <small class="text-danger" id="courseError"></small>
        </div>

        <div class="mb-3">
            <label class="form-label">Ghi chú</label>
            <textarea id="note" class="form-control" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Đăng ký</button>

    </form>

</main>

<footer class="footer text-center">
    <p class="mb-1">CodeHub - Website đăng ký khóa học lập trình</p>
    <p class="mb-0">Sinh viên thực hiện: Lý Khang</p>
</footer>

</body>
</html>
